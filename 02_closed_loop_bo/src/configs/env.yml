name: matinvent-hcap-bo
channels:
  - conda-forge
  - pytorch
  - nvidia
dependencies:
  - python=3.11
  - pip
  - numpy>=1.26,<2.0
  - scipy
  - pandas
  - pyarrow
  - scikit-learn
  - matplotlib
  - seaborn
  - tqdm
  - hydra-core
  - omegaconf
  - jupyterlab
  - ipykernel
  - pytest
  - pytest-cov
  - pip:
      - torch==2.4.0+cu121
      - --extra-index-url https://download.pytorch.org/whl/cu121
      - botorch>=0.11.3
      - gpytorch>=1.12
      - ase>=3.23
      - pymatgen>=2024.6
      - matminer>=0.9.2
      - spglib>=2.4
      - orb-models>=0.5.0
      - mattergen
      - wandb
