pipeline:
  _target_: pipeline.mat_invent.MatInvent
  rl_epoch: ${rl_epoch}
  device: ${device}
  save_dir: ./
  save_freq: 100
  sample_cfg: ${sample_cfg}
  topk_ratio: 0.5
  replay: true
  replay_args:
    buffer_size: 100
    sample_size: 10
    reward_cutoff: 0.1
  div_filter: true
  df_args:
    tol: 3
    buff: 6
  finetune_cfg:
    batch_size: ${eval_size}
    accum_steps: 50
    epochs: 3
    sigma: 0.025
model:
  _target_: src.p3_models.adit_suite.ADiTSuite
  model_name: adit_mp20
  vae_checkpoint: ${oc.env:SCRATCH}/checkpoints/adit/vae.ckpt
  dit_checkpoint: ${oc.env:SCRATCH}/checkpoints/adit/ldm.ckpt
  sample_cfg:
    batch_size: ${eval_size}
    num_batches: 1
  finetune_cfg:
    lr: 1.0e-05
    epochs: 3
    batch_size: ${eval_size}
    timesteps: 4
    accum_steps: 1
    sigma: 0.001
reward:
  _target_: rewards.reward.Reward
  root_dir: rewards
  prop_cfg:
  - name: heat_capacity
    calculator:
      _target_: src.calculators.LocalESEN_GPRouted
      root_dir: rewards/heat_capacity
      task: heat_capacity
      env_name: null
      worker: 1
    target: ascending
    minv: 0.25
    maxv: 2.0
  reward_threshold: 0.8
logger:
  _target_: pipeline.utils.logger.CSVLogger
  save_dir: ./
expname: hcap_p3_adit_accel_seed42_3002432
results_dir: /scratch/user/ahnafalvi/matinvent-hcap-bo/results
device: cuda
rl_epoch: 10
sample_cfg:
  num_batches: 1
  max_num: ${eval_size}
  filter:
    _target_: pipeline.filters.opt_filter.OptFilter
    metrics:
    - validity
    - novel
    - unique
    - stable
    device: ${device}
    silent: true
eval_size: 16
seed: 42
