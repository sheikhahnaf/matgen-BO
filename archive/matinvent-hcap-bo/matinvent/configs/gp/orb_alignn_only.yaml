# GP Configuration for ORB + ALIGNN only (testing without VASP)
# Uses ORB as ground truth for noise estimation

# Property to optimize
task: bulk_modulus

# Calibration phase (for learning noise levels)
calibration_steps: 10              # First 10 steps query both ORB and ALIGNN
calibration_batch_size: null       # null = use all structures

# Noise estimation (for heteroscedastic GP)
calculator_hierarchy:              # Fidelity order (highest first)
  - orb                            # Use ORB as ground truth (no VASP available)
  - alignn                         # ALIGNN compared against ORB
min_paired_samples: 20             # Minimum paired samples to estimate noise
correct_systematic_bias: false     # Include bias in noise estimate (simpler)
noise_floor: 0.1                   # Minimum noise level

# GP retraining frequency (every N RL steps)
retrain_frequency: 5

# Minimum samples before first GP training
min_samples: 10

# PCA components for ORB feature reduction
n_components: 50

# Validation split for GP evaluation
validation_split: 0.2

# Save GP training metrics
save_metrics: true
