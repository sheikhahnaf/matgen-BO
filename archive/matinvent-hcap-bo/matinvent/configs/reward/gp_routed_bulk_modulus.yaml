# GP-routed reward for bulk modulus with intelligent calculator selection
# Uses ORB GP surrogate to route structures to appropriate calculators
_target_: rewards.reward.Reward

root_dir: rewards

prop_cfg:
  - name: bulk_modulus
    use_gp_routing: true

    router:
      _target_: rewards.router.CalculatorRouter

      calculators:
        orb:
          _target_: rewards.calculators.ORBCalculator
          root_dir: rewards/bulk_modulus_orb
          task: bulk_modulus
          device: ${device}
          fmax: 0.05
          model: orb-v2

        alignn:
          _target_: rewards.calculators.ALIGNN
          root_dir: rewards/bulk_modulus_alignn
          task: bulk_modulus
          device: ${device}
          silent: true

        # VASP calculator (for cluster runs)
        # vasp:
        #   _target_: rewards.calculators.DFTCalc
        #   root_dir: rewards/bulk_modulus_vasp
        #   task: bulk_modulus

      gp_model:
        _target_: rewards.gp.surrogate.GPSurrogate
        input_dim: 50  # PCA reduced ORB features
        task: bulk_modulus
        device: ${device}

      featurizer:
        _target_: rewards.calculators.orb.featurizer.ORBFeaturizer
        n_components: 50
        device: ${device}

      acquisition_fn:
        _target_: rewards.acquisition.ExpectedImprovementPerCost
        cost_model:
          alignn: 0.001   # Cheapest - pretrained GNN
          orb: 0.01       # Medium - orbital-based
          vasp: 1.0       # Expensive DFT
        xi: 0.01          # Exploration parameter

      default_calculator: orb
      min_gp_samples: 10

    # Target bulk modulus = 300 GPa
    target: 300.0
    minv: 0.0
    maxv: 250.0

reward_threshold: 0.8
reduce: mean  # or 'min' or 'weight'
