[pytest]
# Pytest configuration for MatInvent

testpaths = tests

# Python files to search for tests
python_files = test_*.py

# Python classes to search for tests
python_classes = Test*

# Python functions to search for tests
python_functions = test_*

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    gpu: marks tests that require GPU
    integration: marks integration tests
    e2e: marks end-to-end tests
    unit: marks unit tests

# Minimal output
addopts =
    --strict-markers
    --tb=short
    --disable-warnings
    -v

# Coverage options (optional)
# Uncomment to enable coverage reporting
# addopts =
#     --cov=rewards
#     --cov=memory
#     --cov=pipeline
#     --cov-report=html
#     --cov-report=term-missing

# Ignore certain warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Timeout for tests (in seconds)
# Requires pytest-timeout
# timeout = 300

# Parallel execution
# Requires pytest-xdist
# Uncomment to run tests in parallel
# addopts = -n auto
